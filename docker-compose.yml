name: reach

services:
  backend:
    build:
      context: ./backend
    container_name: reach_backend

    restart: unless-stopped

    # Copy backend/.env.example to backend/.env first. These files are merged
    # in order, so a root .env can override backend/.env for the container.
    # Do not duplicate settings under `environment`: values there override
    # both files and would silently discard the keys below.
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false

    environment:
      # --- Database ---
      # PostGIS is not part of this stack. Set DATABASE_URL in the root .env
      # (Compose reads it automatically) or export it before `docker compose up`.
      # Use an address the container can reach:
      #   remote: postgresql+asyncpg://user:pass@db.example.com:5432/work_near
      #   host:   postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/work_near
      # `localhost` inside the container is the container itself, not your host.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (postgresql+asyncpg://user:pass@host:5432/work_near)}

      # --- Solana (Model 1 settlement layer) ---
      # sol-contract/ is mounted read-only at /sol-contract (see volumes).
      REACH_ANCHOR_IDL_PATH: ${REACH_ANCHOR_IDL_PATH:-/sol-contract/idl.json}

    volumes:
      # The Anchor IDL the relayer needs to build Solana instructions. It
      # lives outside the backend build context, so mount it read-only.
      - ./sol-contract:/sol-contract:ro

    # Lets the container reach a PostGIS instance published on the host
    # through host.docker.internal (Linux included).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend/reach
      args:
        # Baked into the client bundle at build time. Use a URL the browser
        # can reach (not the Docker service name).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_NOMINATIM_EMAIL: ${NEXT_PUBLIC_NOMINATIM_EMAIL:-contact@example.com}
    container_name: reach_frontend

    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

    ports:
      - "${FRONTEND_PORT:-3000}:3000"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
